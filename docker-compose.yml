services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        INSTALL_STOCKFISH: "${INSTALL_STOCKFISH:-false}"
    environment:
      STOCKFISH_PATH: "${STOCKFISH_PATH:-/usr/games/stockfish}"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
